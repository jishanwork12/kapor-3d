<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kapor 3D Showroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen 3D room with quiet paper-white UI floating above it; one deliberate light look */
:root{
  --paper:#f4f3f0;
  --card:#ffffff;
  --ink:#15171b;
  --muted:#686b72;
  --line:#e2e0db;
  --ok:#1f8a4c;
  --sale:#d92d20;
  --warn:#b54708;
  --wa:#1fa855;
  --gold:#c9962e;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;margin:0;}
#stage{position:fixed;inset:0;}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.04em;transform:skewX(-10deg);display:inline-block;}
.count{min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums;line-height:1;}
.count.bump{animation:bump .4s ease;}
@keyframes bump{40%{transform:scale(1.35);}}
.link{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:13px;}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn.danger{color:#b42318;}
.note{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.5;}
.empty{color:var(--muted);font-size:14px;padding:20px 0;}

/* header */
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:7;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));}
.top > *{pointer-events:auto;}
.brand{display:flex;align-items:baseline;gap:12px;user-select:none;}
.tag{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
.tools{display:flex;gap:6px;align-items:center;}
.ibtn{height:36px;min-width:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;}
.ibtn svg{width:18px;height:18px;flex:none;}
.ibtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
.ibtn[aria-pressed="true"] .count{background:#fff;color:var(--ink);}

/* flash bar + hint */
.flash{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;display:flex;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;}
.flash span:first-of-type{overflow:hidden;text-overflow:ellipsis;}
.flash .cd{font-variant-numeric:tabular-nums;font-weight:700;color:#ffd84d;}
.hint{position:fixed;left:50%;top:calc(98px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;color:var(--muted);background:rgba(255,255,255,.9);border-radius:999px;padding:5px 14px;z-index:4;transition:opacity .5s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;}

/* bottom nav + helpers */
.nav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;z-index:5;box-shadow:0 6px 24px rgba(20,20,20,.08);max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;flex:none;}
.nav button[aria-current="true"]{background:var(--ink);color:#fff;}
.roomsel{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 10px;font-size:14px;font-weight:600;margin-right:4px;}
.joy{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid var(--line);z-index:5;touch-action:none;display:none;}
.joy i{position:absolute;left:27px;top:27px;width:40px;height:40px;border-radius:50%;background:var(--ink);opacity:.8;}
@media (pointer:coarse){.joy{display:block;}}
.float{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.float a,.float button{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:0;box-shadow:0 6px 20px rgba(0,0,0,.18);color:#fff;}
.float .wa{background:var(--wa);}
.float .ms{background:#0a7cff;}
.float .ai{background:var(--ink);}
.float .gift{background:var(--sale);animation:wiggle 2.4s ease-in-out infinite;}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(12deg)}95%{transform:rotate(-6deg)}}
.float svg{width:24px;height:24px;}
body.listmode .nav,body.listmode .joy,body.listmode .hint,body.listmode .dress{display:none!important;}
body.focusing .joy,body.focusing .dress{display:none!important;}
.fade{position:fixed;inset:0;background:var(--paper);z-index:15;opacity:0;pointer-events:none;transition:opacity .35s;display:grid;place-items:center;}
.fade.on{opacity:1;pointer-events:auto;}
.fade b{font-size:22px;}

/* product panel */
.panel{position:fixed;z-index:8;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 40px rgba(20,20,20,.10);
  right:max(20px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 140px);overflow:auto;border-radius:14px;padding:20px;transition:opacity .3s;}
.panel.hide{opacity:0;pointer-events:none;visibility:hidden;}
.panel.modal{z-index:11;left:50%;right:auto;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:calc(100% - 48px);}
.pimg{display:none;width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--paper);border-radius:10px;margin-bottom:14px;max-width:100%;}
.panel.modal .pimg{display:block;}
.lkchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.lkchips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}.lkchips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.lkcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font:inherit;cursor:pointer}.lkcard:hover{border-color:var(--ink)}.lkimgs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.lkimgs img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--paper);border-radius:8px}.lkcard span{font-size:14px;color:var(--muted)}
.lkitems{display:flex;flex-direction:column;gap:8px;margin:12px 0}.lkit{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}.lkit>button:first-child{border:0;padding:0;background:var(--paper);border-radius:10px;cursor:pointer}.lkit img{width:64px;height:64px;object-fit:contain;display:block}.lkit>div{display:flex;flex-direction:column;font-size:14px;min-width:0}.lkit b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lkit select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.lktotal{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin:4px 0 8px}.helphead{display:flex;gap:12px;align-items:center}.helpav{font-size:44px;line-height:1}.helpres{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.dealpill{position:fixed;left:50%;top:calc(98px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;border:0;background:#ffd84d;color:#15171b;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px rgba(0,0,0,.12);cursor:pointer}.dealpill .cd{font-variant-numeric:tabular-nums;font-weight:700;margin-left:4px}
.roofexit{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:11px 20px;font:inherit;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);cursor:pointer}
body.roofmode .mini,body.roofmode .tags{display:none!important}.welcome .roofbtn{width:auto;padding:10px 22px;margin:10px auto 0;display:block}
.liftgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.liftbtn{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;cursor:pointer}.liftbtn span{font-size:13px;color:var(--muted)}.liftbtn:disabled{opacity:.45;cursor:default}.liftbtn:first-child{grid-column:1/-1;background:#15171b;color:#fff}.liftbtn:first-child span{color:#ffd84d}
.steps{padding-left:20px;line-height:1.7;font-size:14px}.steps li{margin-bottom:6px}
.crhead{display:flex;gap:14px;align-items:center}.crhead img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px #ffd84d}
.crlist{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.crlist div{display:grid;grid-template-columns:30px 1fr;column-gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.crlist span{grid-row:1/3;font-size:20px;text-align:center}.crlist b{font-size:14.5px}.crlist small{font-size:12.5px;color:var(--muted)}
.crserv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.crserv span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13.5px}
.crbtns{display:flex;flex-direction:column;gap:8px}.crwa{background:#1fa855!important}
.crwel{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.crwel b{color:var(--ink)}
.crbadge{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;border:2px solid #ffd84d;background:var(--card);border-radius:50%;padding:2px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:transform .2s}.crbadge:hover{transform:scale(1.08)}.crbadge img{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block}.crbadge b{color:var(--ink)}
body.outside .crbadge{display:none}@media (max-width:899px){.crbadge{display:none}}
.crcard{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:12px;align-items:flex-start;max-width:min(380px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.18);animation:crin .5s ease}
.crcard img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}.crcard b{display:block;font-size:14.5px}.crcard span{display:block;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.crcard{top:calc(132px + env(safe-area-inset-top,0px));bottom:auto}}@keyframes crin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.demotag{border:0;background:#ffd84d;color:#15171b;font:inherit;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;cursor:pointer;align-self:center;letter-spacing:.02em}
.demowel{display:inline-block;background:#fff4c2;color:#5a4500;border:1px solid #f2d36b;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.demodone{gap:12px;padding:18px 4px}
.nav .roofnav{background:#15171b;color:#ffd84d;font-weight:600}
.pphotos{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}.pphotos button{flex:0 0 auto;width:86px;height:108px;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--paper);cursor:zoom-in}.pphotos img{width:100%;height:100%;object-fit:cover;display:block}
#lb{position:fixed;inset:0;z-index:90;background:rgba(10,10,12,.92);display:flex;align-items:center;justify-content:center;padding:16px}#lb[hidden]{display:none}#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}#lb button{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer}
.panel.modal .thumbs,.panel.modal .tools2,.panel.modal [data-act="tryon"]{display:none;}
.close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px;line-height:1;display:grid;place-items:center;z-index:2;}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:0 0 2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.pname{font-size:20px;font-weight:700;line-height:1.25;margin:0 40px 6px 0;text-wrap:balance;}
.price{font-size:17px;font-weight:600;margin:0 0 8px;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.price s{color:var(--muted);font-weight:400;font-size:14px;}
.off,.soldtag,.newtag{color:#fff;font-size:12px;border-radius:4px;padding:1px 6px;font-weight:600;}
.off{background:var(--sale);}
.soldtag{background:#3b3e44;}
.newtag{background:var(--gold);}
.lowstock{color:var(--warn);font-size:13px;font-weight:600;margin:-2px 0 8px;}
.stars{color:var(--gold);letter-spacing:1px;}
.desc{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 14px;}
.lbl{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.lbl span{font-weight:400;color:var(--muted);}
.swatches{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.swatches button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.15);padding:0;}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink);}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
.sizes button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 0;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;}
.sizes button:hover:not(:disabled){border-color:var(--ink);}
.sizes button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
.sizes button:disabled{color:#b5b6ba;text-decoration:line-through;background:var(--paper);cursor:not-allowed;}
.actions{display:grid;grid-template-columns:1fr 48px;gap:8px;}
.add{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px;font-size:15px;font-weight:600;transition:background .25s;}
.add.done{background:var(--ok);}
.add:disabled{background:#b5b6ba;cursor:not-allowed;}
.heart{border:1px solid var(--line);background:var(--card);border-radius:999px;display:grid;place-items:center;}
.heart svg{width:20px;height:20px;}
.heart[aria-pressed="true"] svg{fill:var(--sale);stroke:var(--sale);}
.msg{font-size:13px;color:#b42318;min-height:18px;margin:6px 0 4px;}
.ghostbtn{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px;font-size:14px;font-weight:600;margin-bottom:10px;}
.tools2{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;}
.tools2 button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;line-height:1;}
.tools2 input[type=range]{width:110px;}
.sugrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.sugrow button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px;text-align:left;font-size:12px;line-height:1.3;min-width:0;}
.sugrow img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--paper);border-radius:6px;margin-bottom:4px;}
.sugrow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reviews{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px;}
.rev{font-size:13px;line-height:1.5;}
.rev b{font-size:13px;}
.rform{display:grid;gap:8px;}
.rform input,.rform textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;}
.starpick{display:flex;gap:2px;}
.starpick button{border:0;background:none;font-size:22px;color:#d6d3cc;padding:0 2px;}
.starpick button.on{color:var(--gold);}
.thumbs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:8;max-height:80%;overflow:auto;}
.thumbs button{width:52px;height:52px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:4px;}
.thumbs button[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
.thumbs img{width:100%;height:100%;object-fit:contain;}

/* dressing room panel */
.dress{position:fixed;z-index:6;right:max(20px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:330px;max-height:calc(100% - 150px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(20,20,20,.10);}
.dress h3{margin:0 0 2px;font-size:17px;}
.drow{margin:12px 0 0;}
.drow p{margin:0 0 6px;font-size:13px;font-weight:600;}
.dscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
.dscroll button{flex:none;width:58px;height:58px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:4px;font-size:11px;color:var(--muted);}
.dscroll button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:var(--card);}
.dscroll img{width:100%;height:100%;object-fit:contain;}
.dsel{display:grid;gap:6px;margin:12px 0;font-size:13px;}
.dsel div{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;}
.dsel select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);}
.dtotal{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;font-variant-numeric:tabular-nums;}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}

/* list view */
.list{position:fixed;inset:0;z-index:3;background:var(--paper);overflow:auto;
  padding:calc(104px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.lwrap{max-width:1180px;margin:0 auto;}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:18px;}
.filters input[type=search],.filters select{height:38px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0 14px;min-width:0;}
.filters input[type=search]{flex:1 1 220px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
.rng{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.rng b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:56px;}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0;}

/* drawer */

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const memStore={};
const store={get(k,d){let v=null;try{v=localStorage.getItem('kapor-'+k);}catch(e){}if(v==null&&memStore[k]!=null)v=memStore[k];try{return v!=null?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){const s=JSON.stringify(v);memStore[k]=s;try{localStorage.setItem('kapor-'+k,s);return true;}catch(e){return !(e&&/quota/i.test(e.name+e.message));}}};
let S=Object.assign({},DEFAULT_SETTINGS,store.get('settings',{}));

let PRODUCTS=store.get('products',null)||clone(DEFAULT_PRODUCTS);

let room=store.get('room','men');if(!ROOMS[room])room='men';
const t=(k,vars)=>{let s=(T[lang]&&T[lang][k])||T.bn[k]||k;if(vars)for(const x in vars)s=s.replace('{'+x+'}',vars[x]);return s;};

function sizesOf(p){const r=p.room||'men';if(p.sizes&&p.sizes.length)return p.sizes;
  if(p.cat==='clothing')return r==='kids'?['2-3Y','4-5Y','6-7Y','8-9Y']:r==='women'?['XS','S','M','L','XL']:['S','M','L','XL','XXL'];

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const rgb=h=>{h=(h||'#888888').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)||0);};
const shade=(h,a)=>{const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));const[r,g,b]=rgb(h);return`rgb(${f(r)},${f(g)},${f(b)})`;};

function garmentPath(t){
  const p=new Path2D();
  if(t==='dress'){p.moveTo(226,96);p.lineTo(184,104);p.quadraticCurveTo(172,150,178,206);p.quadraticCurveTo(196,250,190,300);p.lineTo(108,600);p.quadraticCurveTo(256,618,404,600);

  const long=t!=='tee';
  p.moveTo(214,100);p.lineTo(150,118);p.quadraticCurveTo(118,128,108,170);
  if(long){p.lineTo(80,468);p.lineTo(132,478);p.lineTo(160,262);}else{p.lineTo(88,262);p.lineTo(142,282);p.lineTo(162,226);}

  p.lineTo(404,170);p.quadraticCurveTo(394,128,362,118);p.lineTo(298,100);p.quadraticCurveTo(256,130,214,100);p.closePath();
  return p;
}
function ribs(ctx,col){ctx.fillStyle=col;ctx.fillRect(150,568,212,34);ctx.fillRect(60,444,92,40);ctx.fillRect(360,444,92,40);
  ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=2;for(let x=150;x<362;x+=6){ctx.beginPath();ctx.moveTo(x,568);ctx.lineTo(x,602);ctx.stroke();}}
function collarWings(ctx,col){
  ctx.fillStyle=col;ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=2;
  [[[212,96],[256,138],[234,174],[192,116]],[[300,96],[256,138],[278,174],[320,116]]].forEach(q=>{ctx.beginPath();q.forEach((pt,i)=>i?ctx.lineTo(...pt):ctx.moveTo(...pt));ctx.closePath();ctx.fill();ctx.stroke();});
}
function star(ctx,x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}

function drawGarment(p,col,hanger){
  const c=mk(512,640),ctx=c.getContext('2d'),t=p.type,acc=p.accent||'#f3f1ea';

panel.addEventListener('input',e=>{if(e.target.id==='spin'){focusSpin=+e.target.value;}});

  if(b.dataset.star){reviewStars=+b.dataset.star;$$('.starpick button').forEach(x=>x.classList.toggle('on',+x.dataset.star<=reviewStars));return;}

  if(a==='rsend'){const name=$('#rName').value.trim(),text=$('#rText').value.trim();if(!name||!text){$('#rmsg').textContent=t('r_need');return;}
    const r={pid:p.id,name,text,rating:reviewStars,date:new Date().toISOString()};const pend=store.get('pendingReviews',[]);pend.unshift(r);store.set('pendingReviews',pend);
    const n=waNumber();if(n)openLink(`https://wa.me/${n}?text=${encodeURIComponent(`নতুন রিভিউ (${p.name})\n${'★'.repeat(r.rating)}\n${name}: ${text}`)}`);

function couponMap(){const m={};String('SPIN5=5%, SPIN10=10%, GIFT15=15%, FREEDEL=free, HUNT20=20%, BDAY10=10%, CAT5=5%,'+(S.coupons||'')).split(',').forEach(x=>{const [k,v]=x.split('=').map(s=>(s||'').trim());if(!k||!v)return;
  if(/free/i.test(v)||v.includes('ফ্রি'))m[k.toUpperCase()]={free:true};else{const n=parseFloat(bnDigits(v));if(n>0)m[k.toUpperCase()]={pct:Math.min(90,n)};}});return m;}
let coupon=store.get('coupon',null);
function validCoupon(){if(!coupon)return null;if(coupon==='BDAY10'&&!bdayActive())return null;const c=couponMap()[coupon];return c?Object.assign({code:coupon},c):null;}
function applyCoupon(code,silent){code=String(code||'').trim().toUpperCase();if(!couponMap()[code]){if(!silent)toast(t('coupon_bad'));return false;}coupon=code;store.set('coupon',code);if(!silent)toast(t('coupon_ok'));if(drawer.classList.contains('open'))renderDrawer();return true;}
const SEGS=[{k:'seg_5',code:'SPIN5',c:'#cfee3a'},{k:'seg_free',code:'FREEDEL',c:'#15171b'},{k:'seg_10',code:'SPIN10',c:'#d92d20'},{k:'seg_none',code:null,c:'#e9e7e0'},{k:'seg_5',code:'SPIN5',c:'#8fb6c9'},{k:'seg_10',code:'SPIN10',c:'#f07a2a'}];
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
const wheelUsed=()=>store.get('wheelDone','')===todayKey();
function drawWheel(){const c=mk(600,600),ctx=c.getContext('2d'),n=SEGS.length;ctx.translate(300,300);
  SEGS.forEach((s,i)=>{const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;ctx.fillStyle=s.c;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,290,a0,a1);ctx.closePath();ctx.fill();
    ctx.save();ctx.rotate((a0+a1)/2);ctx.fillStyle=(s.c==='#15171b'||s.c==='#d92d20')?'#fff':'#15171b';ctx.font='600 30px "Hind Siliguri", sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(t(s.k),262,0);ctx.restore();});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.fill();ctx.fillStyle='#15171b';ctx.font='26px Anton, Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(S.brand.slice(0,6),0,2);
  ctx.strokeStyle='#15171b';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,292,0,7);ctx.stroke();return c;}
function openWheel(){
  if(wheelUsed()){toast(t('wheel_done'));return;}
  openSheet(`<div class="center"><h3 style="margin:0">${t('wheel_title')}</h3><p class="note" style="margin:0">${t('wheel_sub')}</p><div class="wheelbox" id="wheelBox"></div><button class="add" style="width:auto;padding:12px 36px" id="spinGo">${t('wheel_go')}</button><div id="wheelRes"></div></div>`);
  const cv=drawWheel();$('#wheelBox').appendChild(cv);
  $('#spinGo').onclick=()=>{
    $('#spinGo').disabled=true;const i=Math.floor(Math.random()*SEGS.length),seg=SEGS[i];
    const deg=360*6-(i+.5)*(360/SEGS.length);cv.style.transform=`rotate(${deg}deg)`;
    store.set('wheelDone',todayKey());$('#wheelBtn').hidden=true;
    setTimeout(()=>{const res=$('#wheelRes');if(!res)return;
      if(seg.code){applyCoupon(seg.code,true);res.innerHTML=`<p style="margin:0;font-weight:700">${t('win',{x:t(seg.k)})}</p><div class="codebox">${seg.code}</div><p class="note">${t('coupon_applied')}</p>`;}
      else res.innerHTML=`<p style="margin:0;font-weight:600">${t('lose')}</p>`;},reduced?50:4300);
  };
}

const subtotal=()=>cart.reduce((a,c)=>a+c.qty*finalPrice(byId(c.id)),0);
const cartQty=()=>cart.reduce((a,c)=>a+c.qty,0);
const comboAmt=()=>(+S.comboQty>0&&+S.comboPct>0&&cartQty()>=+S.comboQty)?Math.round(subtotal()*S.comboPct/100):0;
const discountAmt=()=>{const c=validCoupon();return c&&c.pct?Math.round((subtotal()-comboAmt())*c.pct/100):0;};
const netGoods=()=>subtotal()-comboAmt()-discountAmt();
const pointsAmt=()=>form.usePoints&&S.pointsOn?Math.min(store.get('points',0),Math.floor(netGoods()*.2)):0;
const freeDel=()=>{const c=validCoupon();return !!(c&&c.free)||(+S.freeDeliveryMin>0&&netGoods()>=+S.freeDeliveryMin);};
const deliveryFee=()=>{if(!cart.length||freeDel())return 0;return form.area==='inside'?+S.deliveryInside:+S.deliveryOutside;};
const wrapFee=()=>form.wrap&&cart.length?+S.giftWrapFee:0;

function sumHtml(full){const c=validCoupon(),r=(l,v,cls)=>`<div${cls?` class="${cls}"`:''}><span>${l}</span><span>${v}</span></div>`;let h=r(t('subtotal'),fmt(subtotal()));
  if(comboAmt())h+=r(t('combo_disc',{p:S.comboPct}),'−'+fmt(comboAmt()),'disc');
  if(discountAmt())h+=r(`${t('discount')} (${c.code})`,'−'+fmt(discountAmt()),'disc');
  if(full&&pointsAmt())h+=r(t('points_disc'),'−'+fmt(pointsAmt()),'disc');
  if(full)h+=r(t('delivery')+(freeDel()?' ('+t('free_del')+')':''),fmt(deliveryFee()));
  if(full&&wrapFee())h+=r(t('wrap_fee'),fmt(wrapFee()));
  return h+r(t('total'),fmt(netGoods()-(full?pointsAmt():0)+(full?deliveryFee()+wrapFee():0)),'grand');}

  if(wantLook&&budget){
    const lr=rm||room;
    const pick=(cat,left)=>pool.filter(p=>p.room===lr&&p.cat===cat&&finalPrice(p)<=left).sort((a,b)=>score(b)-score(a)||finalPrice(b)-finalPrice(a))[0];
    let left=budget;const look=[];const top=pick('clothing',left*.6)||pick('clothing',left);if(top){look.push(top);left-=finalPrice(top);}
    const shoe=pick('shoes',left);if(shoe){look.push(shoe);left-=finalPrice(shoe);}
    const ac=pick('acc',left);if(ac){look.push(ac);left-=finalPrice(ac);}
    if(look.length>=2)return{text:t('bot_look',{t:fmt(look.reduce((a,p)=>a+finalPrice(p),0))}),items:look,look:true};
  }
  const criteria=types.length||cats.length||occ||colors.length;
  let items=pool.filter(p=>!budget||finalPrice(p)<=budget).map(p=>({p,s:score(p)}));
  if(criteria)items=items.filter(x=>x.s>=1);
  items.sort((a,b)=>b.s-a.s||finalPrice(b.p)-finalPrice(a.p));
  if(!criteria&&!budget&&!rm)return{text:t('bot_hi'),items:[]};
  if(!items.length)return{text:t('bot_none'),items:[]};
  return{text:t('bot_found')+(budget?' ('+t('bot_budget',{b:budget.toLocaleString('en-IN')})+')':'')+':',items:items.slice(0,3).map(x=>x.p)};
}

let audio=null;
function startMusic(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  const c=new AC(),master=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
  master.gain.setValueAtTime(0,c.currentTime);master.gain.linearRampToValueAtTime(.55,c.currentTime+2);lp.connect(master);master.connect(c.destination);
  const chords=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]],mtof=m=>440*Math.pow(2,(m-69)/12);let i=0;
  function bar(){const t0=c.currentTime+.05,ch=chords[i%4];
    ch.forEach(n=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=mtof(n-12);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.045,t0+1.2);g.gain.linearRampToValueAtTime(0,t0+4.3);o.connect(g);g.connect(lp);o.start(t0);o.stop(t0+4.4);});
    for(let k=0;k<8;k++){if(Math.random()<.45){const o=c.createOscillator(),g=c.createGain(),st=t0+k*.5;o.type='sine';o.frequency.value=mtof(ch[Math.floor(Math.random()*4)]+12);
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.035,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+1.1);o.connect(g);g.connect(lp);o.start(st);o.stop(st+1.2);}}
    i++;}
  bar();audio={c,master,timer:setInterval(bar,4000)};return true;
}
function stopMusic(){if(!audio)return;const a=audio;audio=null;clearInterval(a.timer);try{a.master.gain.linearRampToValueAtTime(0,a.c.currentTime+.5);setTimeout(()=>a.c.close(),700);}catch(e){}}
$('#musicBtn').onclick=()=>{if(audio){stopMusic();$('#musicBtn').setAttribute('aria-pressed',false);store.set('voiceMute',1);if(window.stopVoice)stopVoice();}else if(startMusic()){$('#musicBtn').setAttribute('aria-pressed',true);store.set('voiceMute',0);}};

function bindInput(el){
  el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,yaw:cam.yawGoal,pitch:cam.pitchGoal,spin:focusSpin,moved:false};el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{
    if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)>6||Math.abs(dy)>6)down.moved=true;
      if(down.moved&&panelMode==='focus'){focusSpin=clamp(down.spin+dx*.6,-180,180);const sp=$('#spin');if(sp)sp.value=focusSpin;return;}
      if(down.moved&&!panelMode&&cam.t>=1){const k=(e.pointerType==='mouse'?3.2:2.6)/innerWidth;
        cam.yawGoal=down.yaw+dx*k;cam.pitchGoal=clamp(down.pitch+dy*k,-.6,.6);hideHint();el.style.cursor='grabbing';}
      return;}
    if(e.pointerType==='mouse'&&!panelMode&&cam.t>=1){hovered=pick(e);el.style.cursor=hovered?'pointer':'grab';}
  });
  el.addEventListener('pointerup',e=>{
    if(!down)return;const moved=down.moved;down=null;if(moved){el.style.cursor='grab';return;}
    const hit=pick(e);
    if(panelMode==='focus'){if(!hit||!panelP||hit!==panelP.mesh)closeProduct();return;}
    if(!hit)return;
    const a=hit.userData.action;
    if(hit.userData.product)openProduct(hit.userData.product);

    else if(a==='tryon'){if(view!=='tryon')goView('tryon');else if(dress.top)openModal(dress.top);}
    else if(a==='newin'){if(view!=='newin')goView('newin');else if(ttPlane.userData.tt)openModal(ttPlane.userData.tt);}

    else if(a==='counter')openDrawer(true,'cart');

    else if(a==='enter')enterStore();
    else if(a==='stairs')goStairs();
    else if(a==='gallery')openGallery();
    else if(a==='hunt')foundHunt(hit);
    else if(LIFE_ACT[a])LIFE_ACT[a](hit);
  });
  el.addEventListener('pointerleave',()=>{hovered=null;});
  el.addEventListener('wheel',e=>{e.preventDefault();
    if(panelMode==='focus'){focusZoom=clamp(focusZoom*Math.exp(-e.deltaY*.0015),1,2.4);return;}
    if(!panelMode&&cam.t>=1&&!outside){const f=forwardFlat();const s=clamp(-e.deltaY*.004,-.5,.5);moveCam(f.x*s,f.z*s);hideHint();}
  },{passive:false});
}

      cam.t=Math.min(1,cam.t+dt/cam.dur);const e=ease(cam.t);

    }else{

function shopperCount(){if(!S.shoppersOn)return 0;const weak=(navigator.deviceMemory&&navigator.deviceMemory<=2)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2);return weak?2:4;}
function spawnShoppers(){

function inCamView(x,z,maxD,minDot){const dx=x-camera.position.x,dz=z-camera.position.z,d=Math.hypot(dx,dz);if(d>maxD||d<.01)return false;
  camera.getWorldDirection(tmpV2);const l=Math.hypot(tmpV2.x,tmpV2.z)||1;return (dx*tmpV2.x+dz*tmpV2.z)/(d*l)>(minDot==null?.55:minDot);}
function chooseSpot(s){const free=SPOTS.filter(p=>!p.occ&&p!==s.spot&&!inCamView(p.x,p.z,3.4)&&(p.c!=='newin'||ttList.length)&&(p.c==='tryon'||p.c==='newin'||PRODUCTS.some(q=>q.room===room&&q.cat===p.c)));
  const sp=free.length?rpick(free):null;if(sp)sp.occ=s;return sp;}
function hub(){return{x:(Math.random()-.5)*.9,z:1.2+(Math.random()-.5)*.6};}
function routeTo(s,dest){s.path=[hub(),dest];}
function productAt(sp){
  if(sp.c==='newin')return ttPlane&&ttPlane.userData.tt||null;if(sp.c==='tryon')return dress.top;
  let best=null,bd=1e9;productMeshes.forEach(m=>{const p=m.userData.product;if(!p||p.cat!==sp.c)return;const d=Math.hypot(m.position.x-sp.x,m.position.z-sp.z);if(d<bd){bd=d;best=p;}});return best;}
function arrive(s,sp){s.state='browse';s.spot=sp;s.ry=s.ry;s.t=4+Math.random()*5;s.p=productAt(sp);s.visits++;}
function shopperLine(p){const n=p.name;return lang==='en'?rpick([`Checking the ${n} 👀`,`Love this ${n}!`,`${n}, ${fmt(finalPrice(p))}?`]):rpick([`${n} দেখছি 👀`,`এই ${n}টা সুন্দর!`,`${n}, মাত্র ${fmt(finalPrice(p))}!`]);}

function shopperClick(s){if(!s)return;if(s.p){showBub(s,shopperLine(s.p)+(lang==='en'?'  (tap)':'  (চাপুন)'),5);}else showBub(s,LL('ঘুরে ঘুরে দেখছি 😊','Just looking around 😊'),3);}
function nextAfterBrowse(s){if(s.spot&&s.spot.occ===s)s.spot.occ=null;
  const r=Math.random();
  if((s.visits>=2&&r<.6&&!queueBusy)||(r<.3&&!queueBusy)){queueBusy=s;s.state='toQueue';s.path=[hub(),{x:QUEUE.x,z:QUEUE.z}];return;}
  if(s.visits<3&&r<.8){const sp=chooseSpot(s);if(sp){s.state='walk';routeTo(s,sp);s.target=sp;return;}}

function leave(s){const d=rpick(DOORS);s.state='leave';s.path=[hub(),...d.via.slice().reverse(),{x:d.x,z:d.z}];}
function spawnOne(s){const d=rpick(DOORS);s.x=d.x;s.z=d.z;s.visits=0;s.p=null;s.g.userData.sbag.visible=false;
  const sp=chooseSpot(s);if(!sp){s.t=3;return;}s.state='walk';s.target=sp;s.path=[...d.via,hub(),{x:sp.x,z:sp.z}];setAlpha(s,.01);}
function stepPath(s,dt){const tg=s.path[0];if(!tg)return true;const dx=tg.x-s.x,dz=tg.z-s.z,d=Math.hypot(dx,dz);
  if(d<.05){s.path.shift();return !s.path.length;}
  let blockd=Math.hypot(camera.position.x-s.x,camera.position.z-s.z)<.8;
  if(!blockd)for(const o of shoppers){if(o===s||o.state==='off')continue;const ox=o.x-s.x,oz=o.z-s.z;if(Math.hypot(ox,oz)<.5&&(ox*dx+oz*dz)>0){blockd=true;break;}}
  if(blockd){s.blockT+=dt;if(s.blockT<1.6){s.anim=0;return false;}}else s.blockT=0;
  const v=Math.min(d,s.speed*dt);s.x+=dx/d*v;s.z+=dz/d*v;s.ry=lerpAngle(s.ry,Math.atan2(dx,dz),dt*8);s.anim=1;return false;}
function updateShoppers(dt){
  if(!shoppers.length)return;
  ambientT-=dt;
  shoppers.forEach(s=>{
    const ud=s.g.userData;
    if(s.state==='off'){s.t-=dt;if(s.t<=0)spawnOne(s);return;}
    let goal=1;
    if(s.state==='walk'||s.state==='toQueue'||s.state==='leave'){
      const done=stepPath(s,dt);
      if(s.state==='leave'&&s.path.length<=1){const last=s.path[0];if(!last||Math.hypot(last.x-s.x,last.z-s.z)<1)goal=0;}
      if(done){
        if(s.state==='walk')arrive(s,s.target);
        else if(s.state==='toQueue'){s.state='pay';s.t=2.6;}
        else{s.state='off';s.t=3+Math.random()*6;setAlpha(s,0);s.bub.visible=false;return;}
      }
      if(inCamView(s.x,s.z,4.4,.3))goal=0;
    }else if(s.state==='browse'){
      s.anim=0;s.ry=lerpAngle(s.ry,s.spot.ry,dt*6);s.t-=dt;
      const close=inCamView(s.x,s.z,4.4,.3)||inCamView(s.x,s.z,3.2,.1);if(close){goal=0;if(!s.bub.visible)s.t=Math.min(s.t,.3);}else if(s.t>1.5&&inCamView(s.spot.x,s.spot.z,3.4)&&!s.bub.visible)s.t=Math.min(s.t,.4);
      if(s.t<=0)nextAfterBrowse(s);
      if(ambientT<=0&&s.p&&!panelMode&&inCamView(s.x,s.z,7)){ambientT=11+Math.random()*7;showBub(s,shopperLine(s.p),3.5);}
    }else if(s.state==='pay'){
      s.anim=0;s.ry=lerpAngle(s.ry,0,dt*6);const pt=s.t;s.t-=dt;
      if(pt>1.2&&s.t<=1.2){waveT=1.4;ud.sbag.visible=true;if(camera.position.distanceTo(new V3(COUNTER.x,1.5,COUNTER.z))<5.5&&!panelMode)say(LL('ধন্যবাদ! আবার আসবেন 😊','Thank you! Come again 😊'),2400);}
      if(s.t<=0){queueBusy=null;leave(s);}
    }
    // হাঁটা বা দেখার ভঙ্গি
    if(s.anim){s.phase+=dt*s.speed*6.5;const sw=Math.sin(s.phase)*.5;ud.legs[0].rotation.x=sw;ud.legs[1].rotation.x=-sw;ud.arms[0].rotation.x=-sw*.7;ud.arms[1].rotation.x=sw*.7;}
    else{const reach=s.state==='browse'?-1.05+Math.sin(elapsed*1.7+s.phase)*.12:s.state==='pay'?-.9:0;
      ud.legs.forEach(l=>l.rotation.x*=.85);ud.arms[0].rotation.x+=(reach-ud.arms[0].rotation.x)*Math.min(1,dt*5);ud.arms[1].rotation.x*=.9;}
    const a=s.alpha+(goal-s.alpha)*Math.min(1,dt*(goal<s.alpha?6:3.5));if(Math.abs(a-s.alpha)>.004||(goal===1&&s.alpha<1&&a>.99))setAlpha(s,a>.99&&goal===1?1:a);
    s.g.position.set(s.x,s.anim?Math.abs(Math.sin(s.phase))*.025:0,s.z);s.g.rotation.y=s.ry;
    if(s.bub.visible){s.bubT-=dt;if(s.bubT<=0||panelMode||s.state==='off')s.bub.visible=false;
      else{s.bub.position.set(s.x,1.62*s.h+.55,s.z);s.bub.quaternion.copy(camera.quaternion);}}
  });
}

function sendHook(obj){if(!S.orderWebhook)return;try{fetch(S.orderWebhook,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:JSON.stringify(obj)}).catch(()=>{});}catch(e){}}

const SHEET_SCRIPT=`function doPost(e){
  var d=JSON.parse(e.postData.contents),ss=SpreadsheetApp.getActiveSpreadsheet(),now=new Date();
  function sh(n,h){var s=ss.getSheetByName(n);if(!s){s=ss.insertSheet(n);s.appendRow(h);s.setFrozenRows(1);}return s;}
  if(d.type==='events'){
    var ev=sh('Events',['সময়','ঘটনা','আইডি','প্রোডাক্ট','ঘর']),st=sh('Stats',['আইডি','প্রোডাক্ট','কতবার দেখা হয়েছে','কতবার কার্টে উঠেছে']);
    var v=st.getDataRange().getValues(),idx={};for(var i=1;i<v.length;i++)idx[v[i][0]]=i+1;
    d.list.forEach(function(x){ev.appendRow([now,x.ev==='view'?'দেখা':'কার্ট',x.id,x.name,x.room]);var r=idx[x.id];
      if(!r){st.appendRow([x.id,x.name,0,0]);r=st.getLastRow();idx[x.id]=r;}var c=x.ev==='view'?3:4;var cell=st.getRange(r,c);cell.setValue((+cell.getValue()||0)+1);});
  }else if(d.type==='hold'){
    sh('Reserve',['সময়','নাম','ফোন','প্রোডাক্ট','সাইজ','কতক্ষণ পর্যন্ত']).appendRow([now,d.name,"'"+d.phone,d.product,d.size,new Date(d.until)]);
  }else if(d.type==='test'){
    sh('Test',['সময়','বার্তা']).appendRow([now,'সংযোগ ঠিক আছে']);
  }else{
    sh('Orders',['সময়','অর্ডার নম্বর','নাম','ফোন','ঠিকানা','এলাকা','পেমেন্ট','TrxID','জিনিস','মোট (৳)','নোট','অবস্থা']).appendRow([now,d.id,d.name,"'"+d.phone,d.address,d.area==='inside'?'ঢাকার ভেতরে':'ঢাকার বাইরে',d.pay,d.trx,
      (d.items||[]).map(function(i){return i.name+(i.color?' ('+i.color+')':'')+' / '+i.size+' x'+i.qty;}).join('\\n'),d.total,d.note,'নতুন']);
  }
  return ContentService.createTextOutput('ok');
}`;

function drawNeon(){const c=mk(1024,256),x=c.getContext('2d');x.fillStyle='#120d1a';x.fill(rr(8,8,1008,240,40));x.strokeStyle='#ff4fa3';x.lineWidth=6;x.shadowColor='#ff4fa3';x.shadowBlur=18;x.stroke(rr(16,16,992,224,34));

  <p class="note" style="margin:0">${LL(`পুরো অর্ডারের ধাপগুলো আসল দোকানের মতোই কাজ করে। আপনার ব্যবসার জন্য এরকম সাইট চাইলে ${esc(crName())}কে মেসেজ দিন।`,`Every step works like a real shop. Want a site like this for your business? Message ${esc(crName())}.`)}</p>
  <button class="add crwa" data-dm="wa">💬 ${LL(`${esc(crName())}কে WhatsApp-এ মেসেজ দিন`,`Message ${esc(crName())} on WhatsApp`)}</button>
  <div class="bar" style="margin:0;justify-content:center"><button class="btn" data-dm="card">${LL('কী কী বানাই দেখুন','See what I make')}</button><button class="btn" data-dm="back">${LL('কার্টে ফিরে যান','Back to cart')}</button></div></div>`;}
(function(){const on=!!S.demoMode;const t=$('#demoTag');if(t){t.hidden=!on;t.title='এটা একটা ডেমো ৩ডি দোকান';t.onclick=()=>openCreator();}const w=$('#demoWel');if(w)w.hidden=!on;})();

/* ---------- জিসান ভাইয়ের কণ্ঠ ---------- */
const VOICE={welcome:'img/voice-welcome.mp3',cart:'img/voice-cart.mp3',roof:'img/voice-roof.mp3',creator:'img/voice-creator.mp3'};
let voiceEl=null;const voiceLast={},voiceSession={};
function stopVoice(){if(voiceEl){try{voiceEl.pause();}catch(e){}voiceEl=null;}}
function playVoice(k,o){o=o||{};if(!S.voiceOn||store.get('voiceMute',0)||!VOICE[k])return false;
  const now=Date.now();if(o.gap&&voiceLast[k]&&now-voiceLast[k]<o.gap)return true;if(o.once&&voiceSession[k])return true;
  if(o.daily){const d=todayKey();if(store.get('voice_'+k,'')===d)return true;store.set('voice_'+k,d);}
  voiceLast[k]=now;voiceSession[k]=1;stopVoice();
  try{const a=new Audio(VOICE[k]);a.volume=.9;voiceEl=a;const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){return false;}return true;}
window.stopVoice=stopVoice;

start();
</script>

</body>
</html>
